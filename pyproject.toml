[project]
name = "jamfin-ha"
version = "0.1.0"
description = "Home Assistant custom integration for Jamfin TV (local push)"
requires-python = ">=3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:aiohttp.*"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D", "T20"]
ignore = [
  "D203", "D213", "D105", "D107",
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
  "RUF012", "PLR0917", "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLC0415", "PLR2004", "S101", "ASYNC110"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant", "custom_components", "tests"]
combine-as-imports = true
